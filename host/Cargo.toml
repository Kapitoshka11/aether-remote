[workspace]
members = [
  "crates/aether-protocol",
  "crates/aether-host-core",
  "crates/aether-host-server",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.6.0"
edition = "2024"
license = "Proprietary"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
